name: "KBO Knit: CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "data/**"
      - "test/**"
      - "scripts/**"
      - ".storybook/**"
      - ".github/workflows/**"
      - "scrape-kbo*.mjs"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "prettier.config.js"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check & Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
