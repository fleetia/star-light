name: "KBO Knit: Deploy to AWS"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "data/**"
      - "scripts/**"
      - "scrape-kbo*.mjs"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - ".github/workflows/kbo-knit-deploy.yml"
      - "!data/**"

permissions:
  packages: read
  id-token: write
  contents: read

concurrency:
  group: kbo-knit-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@fleetia"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.KBO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.KBO_AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ vars.KBO_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.KBO_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
