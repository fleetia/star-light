name: "KBO Knit: Update Data"

on:
  schedule:
    # 3~10월 매일 KST 03:00 (UTC 18:00) 실행, 화요일 제외 (월요일 경기 없음)
    - cron: "0 18 * 3-10 0,2,3,4,5,6"
    # 9~10월은 화요일도 실행 (취소경기 보충)
    - cron: "0 18 * 9,10 1"
  workflow_dispatch:

permissions:
  packages: read
  id-token: write
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@fleetia"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Run KBO scraper
        run: node scrape-kbo.mjs

      - name: Format scraped data
        run: pnpm exec prettier --write "data/*.json"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add data/
          git commit -m "data(kbo-knit): update KBO $(date +%Y) results (${DATE})"
          HUSKY=0 git push

      - name: Configure AWS credentials
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.KBO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.KBO_AWS_REGION }}

      - name: Sync data to S3
        if: steps.changes.outputs.changed == 'true'
        run: aws s3 sync data/ s3://${{ vars.KBO_S3_BUCKET }}/data/ --delete

      - name: Invalidate CloudFront cache
        if: steps.changes.outputs.changed == 'true'
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.KBO_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/data/*"
